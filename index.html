<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CivicSync Municipal Administration Portal - Smart Waste Management Command Center" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CivicSync | Municipal Administration Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Clear any legacy / broken Service Workers and stale caches that break module MIME types
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
        }).catch(function(err) {
          console.warn('Service worker unregister attempt:', err);
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
